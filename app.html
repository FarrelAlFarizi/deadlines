<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CleanSlate</title>
<meta name="theme-color" content="#E9E9EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CleanSlate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem("dl-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.dataset.theme=t;try{var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="dark"?"#070A1F":"#CDBFEA"}catch(e){}})()</script>
<link rel="stylesheet" href="theme.css"></head>
<body>
<main id="login" hidden>
<h1>CleanSlate</h1>
<p>Your classes and deadlines in one place, synced on every device you sign in on.</p>
<button id="signin" class="pri"><span class="lbl">Continue with Google</span></button>
<p id="err" role="alert"></p>
<p class="legal-links">By continuing you agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy policy</a>.</p>
</main>
<main id="app" hidden>
<header><div class="hl"><small id="hello"></small><h1 id="ttl">Today</h1><div class="sub"><small id="sub"></small><small id="st">Syncing</small></div></div>
<div class="hr"><button id="out" class="lnk">Sign out</button></div></header>
<ul id="list"></ul>
<button id="fab" aria-label="New task">+</button>
<nav id="tabs" aria-label="Views"><div><button data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span>Agenda</span></button><button data-v="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg><span>Courses</span></button><button data-v="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg><span>Insights</span></button></div></nav>
</main>
<dialog id="td"><form id="tf">
<h2 id="tdt">New task</h2>
<label>Title<input name="title" required maxlength="120" placeholder="Algorithms assignment 3"></label>
<label>Course<select name="course" id="cs"></select></label>
<label>Type<select name="type"><option>Assignment<option>Quiz<option>Exam<option>Project</select></label>
<label>Due<input type="datetime-local" name="due" required></label>
<label>Notes<textarea name="notes" rows="3"></textarea></label>
<div class="act"><button type="button" id="tdel" class="lnk dng">Delete</button><span></span><button type="button" class="lnk" data-x>Cancel</button><button class="pri">Save task</button></div>
</form></dialog>
<dialog id="cd"><form id="cf">
<h2 id="cdt">New course</h2>
<label>Course name<input name="name" required maxlength="80" placeholder="Algorithms"></label>
<label>Professor<input name="prof" maxlength="80"></label>
<label>Class day<select name="day"><option value="">No weekly class<option value="MO">Monday<option value="TU">Tuesday<option value="WE">Wednesday<option value="TH">Thursday<option value="FR">Friday<option value="SA">Saturday<option value="SU">Sunday</select></label>
<label>Starts<input type="time" name="start"></label>
<label>Ends<input type="time" name="end"></label>
<label>Room<input name="room" maxlength="60" placeholder="B2.3"></label>
<label>Repeats until (end of semester)<input type="date" name="until"></label>
<div class="act"><button type="button" id="cdel" class="lnk dng">Delete</button><span></span><button type="button" class="lnk" data-x>Cancel</button><button class="pri">Save course</button></div>
</form></dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBe49PRXy_VtbrE-2I80AUo28CVUZPhY30",authDomain:"deadline-tracker-220cc.firebaseapp.com",projectId:"deadline-tracker-220cc",storageBucket:"deadline-tracker-220cc.firebasestorage.app",messagingSenderId:"700144852855",appId:"1:700144852855:web:ac7badeace66dc61d4cb72"});
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=m=>{$('#err').textContent=m;$('#st').textContent=m};
const say=e=>{const c=String(e&&e.code||'');return /unavailable|network/.test(c)?'You are offline. Changes will sync when you are back.':/permission/.test(c)?'This account cannot save here. Try signing out and in again.':'Could not save. Check your connection and try again.'};
const fail=e=>{console.error(e);msg(say(e))};
let uid,courses=[],tasks=[],view='agenda',unsubs=[],editing=null,finOpen=false;
const due=t=>new Date(t.due);
const hue=id=>[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360;
const p2=n=>String(n).padStart(2,'0');
const ls=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
const when=d=>d.toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function rel(ms){const a=Math.abs(ms),m=Math.round(a/6e4),h=Math.round(a/36e5),d=Math.round(a/864e5);const v=m<60?`${m} min`:h<48?`${h} h`:`${d} days`;return ms<0?`${v} late`:`in ${v}`}
const IC={"Assignment": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg>", "Quiz": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01\"/></svg>", "Exam": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6\" y=\"4\" width=\"12\" height=\"17\" rx=\"2\"/><path d=\"M9 4h6v3H9zM9.5 14l2 2 3.5-4\"/></svg>", "Project": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 3 9 5-9 5-9-5zM3 13l9 5 9-5\"/></svg>", "Course": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z\"/><path d=\"M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3\"/></svg>", "Today": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 2\"/></svg>", "check": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 12.5 4 4 8-9\"/></svg>"};
const empty=(a,b)=>`<li class="empty"><span class="eic">${IC.Today}</span><b>${a}</b>${b}</li>`;
const path=(n,id)=>doc(db,`users/${uid}/${n}/${id}`);

let signing=false;const si=$('#signin');
const busy=b=>{signing=b;si.disabled=b;si.setAttribute('aria-busy',String(b));si.querySelector('.lbl').textContent=b?'Opening Google\u2026':'Continue with Google'};
si.onclick=async()=>{
 if(signing)return;
 $('#err').textContent='';
 if(navigator.onLine===false){$('#err').textContent='You\u2019re offline. Connect to the internet, then try again.';return}
 busy(true);const p=new GoogleAuthProvider();
 try{await signInWithPopup(auth,p);busy(false)}
 catch(e){
  if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')){busy(false);return}
  try{await signInWithRedirect(auth,p)}
  catch(e2){console.error(e2);busy(false);$('#err').textContent='Couldn\u2019t sign you in. Check your connection and try again. If a pop-up was blocked, allow pop-ups for this site.'}
 }
};
const installed=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
$('#out').onclick=async()=>{
 dispatchEvent(new Event('pagehide'));/* save deletions still in their undo window */
 try{await signOut(auth)}catch(e){console.error(e)}
 if(!installed())location.replace('index.html');/* the landing page sends installed apps straight back here */
};
onAuthStateChanged(auth,u=>{
 unsubs.forEach(f=>f());unsubs=[];
 $('#login').hidden=!!u;$('#app').hidden=!u;
 if(!u){uid=null;return}
 uid=u.uid;$('#sub').textContent=new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});
 const sub=(n,cb)=>onSnapshot(collection(db,`users/${uid}/${n}`),s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));render();$('#st').textContent=s.metadata.hasPendingWrites?'Saving':s.metadata.fromCache?'Offline copy':'Synced'},fail);
 unsubs=[sub('courses',a=>courses=a.filter(c=>!c.deleted)),sub('tasks',a=>tasks=a.filter(t=>!t.deleted))];
});

function render(){
 const L=$('#list'),f=document.activeElement;let k=null;
 if(f&&L.contains(f)){const li=f.closest('li');if(li)k={id:li.dataset.id||li.dataset.c,sel:f.classList.contains('chk')?'.chk':'.b'}}
 draw();
 if(k&&k.id){const li=[...L.children].find(x=>(x.dataset.id||x.dataset.c)===k.id),t=li&&li.querySelector(k.sel);if(t)t.focus({preventScroll:true})}
}
function draw(){
 if(!uid)return;
 $('#ttl').textContent={agenda:'Agenda',courses:'Courses',insights:'Insights'}[view];
 $('#fab').setAttribute('aria-label',view==='courses'?'New course':'New task');
 document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.v===view;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const L=$('#list');
 if(view==='insights'){L.innerHTML='';return}
 if(view==='courses'){
  L.innerHTML=courses.length?[...courses].sort((a,b)=>a.name.localeCompare(b.name)).map((c,i)=>`<li class="t" data-c="${c.id}" style="--h:${hue(c.id)};--i:${i}"><span class="ic">${IC.Course}</span><button type="button" class="b"><b>${esc(c.name)}</b><small>${esc([c.prof,c.day?({MO:'Mon',TU:'Tue',WE:'Wed',TH:'Thu',FR:'Fri',SA:'Sat',SU:'Sun'})[c.day]+' '+c.start+'-'+c.end:c.sched,c.room].filter(Boolean).join(', '))||'No details yet'}</small></button><span class="r">${tasks.filter(t=>t.courseId===c.id&&!t.done).length} open</span></li>`).join(''):empty('No courses yet','Tap + to add a course, then link tasks to it.');
  return;
 }
 L.innerHTML=agenda();
}
/* One task row; the tick and the row both name the task and its timing for screen readers */
function taskRow(t,i,nx){
 const c=courses.find(x=>x.id===t.courseId),ms=due(t)-Date.now(),r=t.done?'Finished':rel(ms);
 const u=t.done?'fin':ms<0?'late':ms<1728e5?'soon':'';
 return `<li class="t ${u}${t===nx?' next':''}" data-id="${t.id}" data-type="${esc(t.type)}" style="--h:${c?hue(c.id):230};--i:${i}"><span class="ic">${IC[t.type]||IC.Assignment}</span><button type="button" class="b"><b>${esc(t.title)}</b><small>${esc(c?c.name:'No course')}</small><small>${esc(t.type)}, ${when(due(t))}</small><span class="vh">, ${r}</span></button><span class="r" aria-hidden="true">${r}</span><button class="chk" data-k="${t.id}" aria-pressed="${!!t.done}" aria-label="${t.done?'Finished: ':'Mark done: '}${esc(t.title)}">${IC.check}</button></li>`;
}
/* A weekly class on a given day; tapping it changes just that date */
function classCard(o,today){
 const nowHM=p2(new Date().getHours())+':'+p2(new Date().getMinutes()),past=today&&!o.x&&o.end<=nowHM;
 const note=[o.room,o.mv&&'Moved',o.x&&'Cancelled',past&&'Over'].filter(Boolean).join(', ');
 return `<li class="c${o.x?' x':''}${past?' past':''}" data-c="${o.c.id}" style="--h:${hue(o.c.id)}"><button type="button" class="cgo" data-ok="${o.k}"><time>${o.start} to ${o.end}</time><span class="cinfo"><b>${esc(o.c.name)}</b>${note?`<small>${esc(note)}</small>`:''}</span></button></li>`;
}
/* The semester agenda: Overdue, Today, each coming day with classes and deadlines in time order, Later, then Finished */
function agenda(){
 const D=864e5,now=Date.now(),sod=new Date();sod.setHours(0,0,0,0);const s0=sod.getTime();
 const key=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,hm=d=>p2(d.getHours())+':'+p2(d.getMinutes());
 const open=tasks.filter(t=>!t.done).sort((x,y)=>due(x)-due(y)),done=tasks.filter(t=>t.done).sort((x,y)=>due(y)-due(x));
 const nx=open.find(t=>due(t)>=now),occ=window.dlOccs?window.dlOccs(sod,new Date(s0+6*D),courses):[];
 let h='',i=0;
 const head=(label,sub,cls='')=>`<li class="day${cls}"><h2>${label}${sub?`<span>${sub}</span>`:''}</h2></li>`;
 const over=open.filter(t=>due(t)<now);
 if(over.length)h+=head('Overdue','',' od')+over.map(t=>taskRow(t,i++,nx)).join('');
 for(let n=0;n<7;n++){
  const d=new Date(s0+n*D),k=key(d),from=Math.max(now,d.getTime()),to=s0+(n+1)*D;
  const ts=open.filter(t=>{const x=due(t).getTime();return x>=from&&x<to});
  const cs=occ.filter(o=>o.date===k);
  if(!ts.length&&!cs.length&&n)continue;
  const it=[...cs.map(o=>({at:o.start,html:classCard(o,n===0)})),...ts.map(t=>({at:hm(due(t)),t}))].sort((a,b)=>a.at.localeCompare(b.at));
  h+=head(n===0?'Today':n===1?'Tomorrow':d.toLocaleDateString([],{weekday:'long'}),d.toLocaleDateString([],n<2?{weekday:'short',day:'numeric',month:'short'}:{day:'numeric',month:'short'}));
  h+=it.length?it.map(x=>x.t?taskRow(x.t,i++,nx):x.html).join(''):'<li class="none">Nothing left today</li>';
 }
 const later=open.filter(t=>due(t).getTime()>=s0+7*D);
 if(later.length)h+=head('Later')+later.map(t=>taskRow(t,i++,nx)).join('');
 if(done.length)h+=`<li class="fin-tog"><button type="button" class="lnk" aria-expanded="${finOpen}">Finished<span>${done.length}</span></button></li>`+(finOpen?done.map(t=>taskRow(t,i++,null)).join(''):'');
 if(!open.length&&!occ.length&&!done.length)return empty('Nothing coming up','Tap + to add a deadline.');
 return h;
}
setInterval(render,6e4);

$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render()}};
$('#fab').onclick=()=>view==='courses'?openCourse():openTask();
$('#list').onclick=e=>{
 const ft=e.target.closest('.fin-tog button');if(ft){finOpen=!finOpen;render();$('#list .fin-tog button')?.focus();return}
 const cl=e.target.closest('li.c');if(cl){window.dlChangeClass?.(cl.dataset.c,cl.querySelector('.cgo')?.dataset.ok);return}
 const k=e.target.closest('[data-k]');
 if(k){const t=tasks.find(x=>x.id===k.dataset.k);setDoc(path('tasks',t.id),{done:!t.done,doneAt:t.done?0:Date.now(),updatedAt:Date.now()},{merge:true}).catch(fail);return}
 const li=e.target.closest('li');if(!li)return;
 li.dataset.c?openCourse(li.dataset.c):li.dataset.id&&openTask(li.dataset.id);
};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

function openTask(id,cid){
 window.dlEdit=id||null;editing=id||null;const t=tasks.find(x=>x.id===id),f=$('#tf');
 $('#tdt').textContent=t?'Edit task':'New task';$('#tdel').hidden=!t;
 $('#cs').innerHTML='<option value="">No course</option>'+courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 const d=new Date();d.setDate(d.getDate()+1);d.setHours(23,59,0,0);
 f.title.value=t?.title||'';f.course.value=t?.courseId||cid||'';f.type.value=t?.type||'Assignment';f.due.value=t?.due||ls(d);f.notes.value=t?.notes||'';
 $('#td').showModal();
}
$('#tf').onsubmit=e=>{
 e.preventDefault();const f=e.target,id=editing||crypto.randomUUID(),old=tasks.find(x=>x.id===id);
 setDoc(path('tasks',id),{title:f.title.value.trim(),courseId:f.course.value,type:f.type.value,due:f.due.value,notes:f.notes.value.trim(),done:old?.done||false,doneAt:old?.doneAt||0,updatedAt:Date.now()}).catch(fail);
 $('#td').close();
};
$('#tdel').onclick=()=>{if(confirm('Delete this task?')){setDoc(path('tasks',editing),{deleted:true,updatedAt:Date.now()},{merge:true}).catch(fail);$('#td').close()}};

function openCourse(id){
 window.dlEditC=id||null;editing=id||null;const c=courses.find(x=>x.id===id),f=$('#cf');
 $('#cdt').textContent=c?'Edit course':'New course';$('#cdel').hidden=!c;
 f.name.value=c?.name||'';f.prof.value=c?.prof||'';f.day.value=c?.day||'';f.start.value=c?.start||'';f.end.value=c?.end||'';f.room.value=c?.room||'';f.until.value=c?.until||'';
 window.dlCourse=c;const g=$('#chg');if(g)g.hidden=!(c&&c.day&&c.start&&c.until);$('#cd').showModal();
}
$('#cf').onsubmit=e=>{
 e.preventDefault();const f=e.target,id=editing||crypto.randomUUID();
 setDoc(path('courses',id),{name:f.name.value.trim(),prof:f.prof.value.trim(),day:f.day.value,start:f.start.value,end:f.end.value,room:f.room.value.trim(),until:f.until.value,updatedAt:Date.now()},{merge:true}).catch(fail);
 $('#cd').close();
};
$('#cdel').onclick=()=>{if(confirm('Delete this course? Its tasks stay, but lose the course link.')){setDoc(path('courses',editing),{day:'',deleted:true,updatedAt:Date.now()},{merge:true}).catch(fail);$('#cd').close()}};
window.dlOpenTask=openTask;window.dlOpenCourse=openCourse;

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

<script type="module" src="backup.js"></script>
<script type="module" src="erase.js"></script>
<script type="module" src="ui.js"></script>
<script type="module" src="motion.js"></script>
<script type="module" src="insights.js"></script>
<script type="module" src="sky.js"></script>
<script type="module" src="select.js"></script>

<script type="module" src="sound.js"></script>
</body></html>
